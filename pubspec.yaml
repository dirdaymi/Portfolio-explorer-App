name: portfolio_explorer
description: "A dynamic portfolio application showcasing skills through interactive content."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Animations
  google_fonts: ^6.1.0
  curved_navigation_bar: ^1.0.3
  animations: ^2.0.8
  
  # API & Networking
  http: ^1.1.0
  dio: ^5.3.2
  
  # Images & Caching
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Icons
  font_awesome_flutter: ^10.6.0
  
  # Utils
  intl: ^0.18.1
  shimmer: ^3.0.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  
  # State Management (simple)
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/data/
